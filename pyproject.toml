[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wintsr"
version = "0.1.0"
description = "Windowed Temporal Saliency Rescaling: interpretability for time series deep learning models"
readme = "docs/pypi_readme.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Md Khairul Islam", email = "khairulislam@virginia.edu" },
    { name = "Judy Fox" },
]
keywords = [
    "time-series",
    "interpretability",
    "explainable-ai",
    "xai",
    "saliency",
    "captum",
    "pytorch",
    "forecasting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=1.13",
    "numpy",
    "captum>=0.6",
    "time-interpret>=0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib"]

[project.urls]
Homepage = "https://github.com/khairulislam/WinTSR"
Repository = "https://github.com/khairulislam/WinTSR"
Paper = "https://arxiv.org/abs/2412.04532"

[tool.setuptools]
# src-layout: only what lives under src/ ships. The training/interpretation
# harness that reproduces the paper's results lives in a separate repo, see
# the Homepage README.
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
