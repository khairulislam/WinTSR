site_name: tslens
site_description: A consistent PyTorch interface to 14 time-series attribution methods, including WinTSR.
site_url: https://khairulislam.github.io/tslens/
repo_url: https://github.com/khairulislam/tslens
repo_name: khairulislam/tslens
edit_uri: edit/main/docs/

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Guides:
      - Integration cookbook: integration.md
      - Supported models: models.md
  - Interpretation methods: methods.md
  - Related work: related_works.md
  - API reference:
      - Overview: reference/index.md
      - WinTSR: reference/wintsr.md
      - TSR: reference/tsr.md
      - WinIT: reference/winit.md
      - GateMask: reference/gate_mask.md
      - Functional utilities: reference/functional.md

exclude_docs: |
  pypi_readme.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
